# ── Gradle ──────────────────────────────────────────────────────────────────
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G
org.gradle.parallel=true
org.gradle.caching=true
# Loom's remap/decompile tasks are not configuration-cache safe.
org.gradle.configuration-cache=false

# ── Mod identity ────────────────────────────────────────────────────────────
mod.id=multichat
mod.name=Multi-Chat Link
mod.group=de.taczbg.multichat
mod.version=1.0.2
mod.license=LGPL-3.0-only
mod.description=Bridges server chat with other servers and platforms through a Redis stream.
mod.authors=TACZ-BG
mod.source=https://github.com/frs-projects/multi-chat

# ── Toolchain ───────────────────────────────────────────────────────────────
# :core targets the lowest Java in the matrix (1.20.1 runs on Java 17).
core.java=17
