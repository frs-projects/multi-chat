# Deploys the bridge. All configuration is env-only (see .env.example).
#
# Dokploy: set the variables in the service's Environment tab. Dokploy writes them to a
# .env file NEXT TO THIS COMPOSE FILE inside its clone of the repo
# (/etc/dokploy/compose/<app>/code/<compose dir>/.env), regenerated on every deploy -
# never edit that file by hand. Both entries below are optional so the stack also works
# locally (copy .env.example to .env) or with setups that put the .env at the repo root;
# the one next to this file wins because it is listed last.
#
# REDIS_URL must point at the same Redis instance the Link-Mod servers use; it defaults
# to redis://redis:6379 so it slots into a stack that already has a "redis" service.
services:
  bridge:
    build: .
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
    env_file:
      - path: ../.env
        required: false
      - path: .env
        required: false
