# multichat-bridge configuration. Copy to multichat-bridge.toml and adjust.
# Secrets can (and should) come from the environment instead: REDIS_URL, DISCORD_TOKEN.

[redis]
url = "redis://127.0.0.1:6379"       # redis://user:pass@host:port also works
streamKey = "multichat:events"       # must match the mod's redis.streamKey
maxStreamLength = 10000
maxCatchupAgeSeconds = 300           # skip missed messages older than this after downtime

[connectors.discord]
enabled = false
sourceId = "discord"                 # label stamped on messages coming FROM Discord
ignoreBots = true                    # drop messages written by other bots
# token = ""                         # prefer the DISCORD_TOKEN env variable

# One block per bridged channel. channel = inbound (gateway) + bot-message fallback,
# webhook = outbound with per-player name/avatar. Set inbound = false for
# announce-only channels (e.g. a #server-status channel).
[[connectors.discord.channels]]
channel = "123456789012345678"
webhook = "https://discord.com/api/webhooks/..."
types = ["*"]                        # or a subset: ["chat", "join", "leave", "status"]
sources = ["*"]                      # or specific servers: ["EU_1", "EU_2"]
inbound = true

# Templates for non-chat types (chat goes through the webhook with the player's own
# name/avatar when a webhook is configured). Placeholders: {source} {name} {message} {type}.
[connectors.discord.formats]
chat        = "**[{source}]** {name}: {message}"
join        = "*[{source}] {name} joined the game*"
leave       = "*[{source}] {name} left the game*"
death       = "*[{source}] {message}*"
advancement = "*[{source}] {message}*"
status      = "**[{source}] server {message}**"
default     = "**[{source}]** {name}: {message}"

# stdin/stdout test connector: prints stream messages, publishes typed lines as chat.
[connectors.cli]
enabled = false
sourceId = "cli"
